<!DOCTYPE html>
<html>
<head>
  <title>Login - SuiteSpot</title>
  <link rel="stylesheet" href="style.css">

  <style>

    body{
      margin:0;
      padding:0;
      font-family:Arial, sans-serif;
      background:
        linear-gradient(
          rgba(0,0,0,0.75),
          rgba(0,0,0,0.75)
        ),
        url("https://images.unsplash.com/photo-1566073771259-6a8506099945?q=80&w=1470&auto=format&fit=crop");
      background-size:cover;
      background-position:center;
      height:100vh;

      display:flex;
      justify-content:center;
      align-items:center;
    }

    .login-box{
      background:#111;
      padding:40px;
      width:350px;
      border-radius:15px;
      box-shadow:0 0 20px rgba(212,175,55,0.3);
      text-align:center;
      border:1px solid #d4af37;
    }

    .login-box h2{
      color:#d4af37;
      margin-bottom:30px;
      font-size:32px;
    }

    .login-box input{
      width:100%;
      padding:12px;
      margin-bottom:18px;
      border:none;
      border-radius:8px;
      outline:none;
      font-size:15px;
      background:#222;
      color:white;
    }

    .login-box input::placeholder{
      color:#aaa;
    }

    .login-box button{
      width:100%;
      padding:12px;
      background:#d4af37;
      color:black;
      border:none;
      border-radius:8px;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    .login-box button:hover{
      background:#f1c94a;
      transform:scale(1.03);
    }

    #msg{
      margin-top:15px;
      color:white;
    }

    .signup-link{
      display:block;
      margin-top:20px;
      color:#d4af37;
      text-decoration:none;
    }

    .signup-link:hover{
      text-decoration:underline;
    }

  </style>
</head>

<body>

<div class="login-box">

  <h2>SuiteSpot</h2>

  <input id="email" placeholder="Email">

  <input id="password" type="password" placeholder="Password">

  <button onclick="login()">Login</button>

  <p id="msg"></p>

  <a class="signup-link" href="signup.html">
    No account yet? Sign Up
  </a>

</div>

<script src="auth.js"></script>

<script>

async function login() {

const email = document.getElementById("email").value;
const password = document.getElementById("password").value;
const msg = document.getElementById("msg");

try {

  const res = await fetch("http://localhost:5000/users/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password })
  });

  const text = await res.text();

  console.log("RAW RESPONSE:", text);

  let data;

  try {

    data = JSON.parse(text);

  } catch (e) {

    msg.innerText = "Backend not returning JSON";
    return;

  }

  if (!res.ok) {

    msg.innerText = data.message || "Login failed";
    return;

  }

  localStorage.setItem("userEmail", email);

  afterLoginRedirect();

} catch (err) {

  console.log(err);
  msg.innerText = "Cannot connect to server";

}

}

</script>

</body>
</html>
